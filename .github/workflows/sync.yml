name: Sync from Codeberg
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v5

      - name: Clone Codeberg repo (Private)
        run: |
          git clone --depth 1 https://oauth2:${{ secrets.CODEBERG_TOKEN }}@codeberg.org/djeauh/MegaProject.git source_repo

      - name: Copy README, Notes and Images
        run: |
          cp source_repo/README.md ./README.md
          mkdir -p Notes Assets/Images
          rsync -a --delete --delete-excluded \
            --exclude '/Research/' \
            --exclude '/Documentation/' \
            source_repo/Notes/ ./Notes/
          rsync -a --delete source_repo/Assets/Images/ ./Assets/Images/

      - name: Commit and Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A README.md Notes Assets/Images
          if git diff --cached --quiet; then
            echo "Nothing to update"
            exit 0
          fi
          git commit -m "Sync: Update README, Notes and Images from Codeberg"
          git push
