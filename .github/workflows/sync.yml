name: Sync from Codeberg
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v4 # Reste en v4, le flag env ci-dessus gère le Node 24
        with:
          persist-credentials: true

      - name: Clone Codeberg repo (Private)
        run: |
          git clone https://oauth2:${{ secrets.CODEBERG_TOKEN }}@codeberg.org/djeauh/MegaProject.git source_repo

      - name: Copy README and Assets
        run: |
          cp source_repo/README.md ./
          mkdir -p Assets/Images
          cp -rf source_repo/Assets/Images/. ./Assets/Images/

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md Assets/Images/
          git commit -m "Sync: Update README and Assets from Codeberg" || echo "Nothing to update"
          git push